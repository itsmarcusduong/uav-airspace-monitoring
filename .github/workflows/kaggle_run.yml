# ADR-0016: chay job Kaggle W9 - CHI bam tay (Actions -> kaggle-run -> Run workflow). Ket qua la artifact, khong tu commit.
# Secret can co (Quang tu them): KAGGLE = API token moi cua Kaggle (KGAT_...) hoac noi dung kaggle.json;
# hoac cap cu KAGGLE_USERNAME + KAGGLE_KEY. Job 'check' chi kiem ket noi (datasets status), khong chay notebook.
name: kaggle-run
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job Kaggle"
        required: true
        type: choice
        options: [check, run18_bench, run19_neg_fbdsv, run20_stability]
      commit:
        description: "SHA day du 40 ky tu (main da merge)"
        required: true
      config:
        description: "run20_stability: C0/C1/C2 (bat buoc). run18_bench: C0/C1/C2 de chi chay mot cau hinh (run 18b), de trong = ca ke hoach"
        required: false
        default: ""
      tag:
        description: "Nhan run (a-z, 0-9): tao notebook Kaggle rieng e1-w9-<job>-<tag>; de trong = notebook mac dinh"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: kaggle-${{ inputs.job }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cai Kaggle CLI
        run: pip install "kaggle>=2.2,<3" six            # kaggle 2.2.5 import six nhung khong khai bao phu thuoc (job check #1)
      - name: Nap khoa Kaggle (khong in gia tri)
        env:
          K_TOKEN: ${{ secrets.KAGGLE }}
          K_USER: ${{ secrets.KAGGLE_USERNAME }}
          K_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/kaggle/actions_kaggle_auth.py
      - name: Chay job tren Kaggle
        env:
          IN_JOB: ${{ inputs.job }}
          IN_COMMIT: ${{ inputs.commit }}
          IN_CONFIG: ${{ inputs.config }}
          IN_TAG: ${{ inputs.tag }}
        # dau vao di qua bien moi truong, khong chen thang vao lenh shell
        run: python scripts/kaggle/actions_kaggle_run.py --job "$IN_JOB" --commit "$IN_COMMIT" --config "$IN_CONFIG" --tag "$IN_TAG" --out out
      - name: Tai ket qua len lam artifact (30 ngay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-${{ inputs.job }}-${{ github.run_id }}
          path: |
            out/ACTIONS_OUTPUT_MANIFEST.json
            out/kernel_output/
          retention-days: 30
          if-no-files-found: warn
