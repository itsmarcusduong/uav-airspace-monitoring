# YOLOv8n @960 — tách ảnh hưởng ĐỘ PHÂN GIẢI (so với A @640) khỏi ảnh hưởng KÍCH THƯỚC MODEL (so với B = YOLOv8s @960).
# Chỉ đổi imgsz và batch (batch 16 như B; Ultralytics tích lũy gradient về nbs=64). Không đổi sau khi đã chạy.
experiment: baseline_A_960
dataset_version: e1-yolo-v1          # phải trùng dataset_card.json của dữ liệu xuất (Kaggle run 03)
model: yolov8n.pt                   # COCO-pretrained; license AGPL-3.0 (Ultralytics)
ultralytics_version: ""              # điền từ env.json của run train đầu tiên; các run sau cài đúng bản này

train:                               # tham số truyền thẳng vào YOLO.train()
  imgsz: 960
  epochs: 50
  patience: 15                       # dừng sớm nếu fitness trên val không cải thiện 15 epoch
  batch: 16
  seed: 20261013
  deterministic: true
  workers: 4
  optimizer: auto
  pretrained: true
  close_mosaic: 10
  cache: false
  plots: true
  val: true

val:                                 # đánh giá best.pt trên split val (test bị khóa đến đánh giá cuối)
  split: val
  imgsz: 960
  batch: 32
  conf: 0.001                        # ngưỡng thấp để tính mAP/PR đầy đủ; ngưỡng vận hành chọn sau trên val
  iou: 0.6                           # NMS IoU
  plots: true
  save_json: true
