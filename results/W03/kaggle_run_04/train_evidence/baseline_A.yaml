# Cấu hình baseline A — BẢN ĐỀ XUẤT (Quang soạn khung 13/10/2026).
# An rà soát/điều chỉnh trong issue W3-04, ghi lý do từng giá trị vào docs/w3/training_protocol.md.
# Không đổi file này sau khi đã chạy run chính thức; muốn đổi thì tạo baseline_A_v2.yaml và ghi ADR.
experiment: baseline_A
dataset_version: e1-yolo-v1          # phải trùng dataset_card.json của dữ liệu xuất (Kaggle run 03)
model: yolov8n.pt                    # COCO-pretrained (Thuyết minh 7.2: YOLOv8n @640). License: kiểm ở W3-07
ultralytics_version: ""              # điền từ env.json của run train đầu tiên; các run sau cài đúng bản này

train:                               # tham số truyền thẳng vào YOLO.train()
  imgsz: 640
  epochs: 50
  patience: 15                       # dừng sớm nếu fitness trên val không cải thiện 15 epoch
  batch: 32
  seed: 20261013
  deterministic: true
  workers: 4
  optimizer: auto
  pretrained: true
  close_mosaic: 10
  cache: false
  plots: true
  val: true

val:                                 # đánh giá best.pt trên split val (test bị khóa đến đánh giá cuối)
  split: val
  imgsz: 640
  batch: 32
  conf: 0.001                        # ngưỡng thấp để tính mAP/PR đầy đủ; ngưỡng vận hành chọn sau trên val
  iou: 0.6                           # NMS IoU
  plots: true
  save_json: true
